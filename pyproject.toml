[project]
name = "sam3-ball-tracking"
version = "0.1.0"
description = "SAM3-based ball-in-play tracking for soccer and tennis video"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "einops>=0.8.2",
    "numpy>=2.3.5",
    "opencv-python>=4.10.0.84",
    "Pillow>=10",
    "huggingface-hub>=0.30",
    "safetensors>=0.5.0",
    "sam3",
    "scipy>=1.14.0",
    "torch>=2.8,<2.9",
    "torchcodec>=0.7.0,<0.8",
    "tqdm>=4.66",
    "zstandard>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
sam3-ball-track = "main:main"

[tool.uv.sources]
sam3 = { workspace = true, editable = true }

[tool.uv.workspace]
members = ["sam3"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ball*", "sports*", "utils*", "vision*"]
namespaces = true

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
